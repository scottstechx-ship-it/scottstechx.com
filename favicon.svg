<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056D2"/>
      <stop offset="100%" style="stop-color:#00B8D9"/>
    </linearGradient>
  </defs>
  <!-- Hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18"
    fill="url(#bg)"/>
  <!-- S -->
  <text x="32" y="40"
    font-family="Poppins, Arial, sans-serif"
    font-size="30"
    font-weight="800"
    fill="white"
    text-anchor="middle">S</text>
  <!-- Nodes -->
  <circle cx="32" cy="4" r="2.5" fill="#00B8D9"/>
  <circle cx="58" cy="18" r="2.5" fill="#00B8D9"/>
  <circle cx="58" cy="46" r="2.5" fill="#00B8D9"/>
  <circle cx="32" cy="60" r="2.5" fill="#00B8D9"/>
  <circle cx="6" cy="46" r="2.5" fill="#00B8D9"/>
  <circle cx="6" cy="18" r="2.5" fill="#00B8D9"/>
  <!-- Orbit -->
  <ellipse cx="32" cy="32" rx="24" ry="13"
    fill="none" stroke="white" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3"/>
</svg>
