<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B8D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0056D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B8D9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0056D2" flood-opacity="0.25"/>
    </filter>
    <clipPath id="hexClip">
      <polygon points="28,4 50,16 50,44 28,56 6,44 6,16"/>
    </clipPath>
  </defs>

  <!-- Icon group -->
  <g transform="translate(10, 20)">
    <!-- Hexagon background -->
    <polygon points="28,4 50,16 50,44 28,56 6,44 6,16"
      fill="url(#bgGrad)"
      filter="url(#shadow)"/>

    <!-- S letter with tech lines -->
    <text x="28" y="40"
      font-family="Poppins, Arial, sans-serif"
      font-size="26"
      font-weight="800"
      fill="white"
      text-anchor="middle"
      dominant-baseline="middle">S</text>

    <!-- Network nodes -->
    <circle cx="28" cy="4" r="2.5" fill="#00B8D9"/>
    <circle cx="50" cy="16" r="2.5" fill="#00B8D9"/>
    <circle cx="50" cy="44" r="2.5" fill="#00B8D9"/>
    <circle cx="28" cy="56" r="2.5" fill="#00B8D9"/>
    <circle cx="6" cy="44" r="2.5" fill="#00B8D9"/>
    <circle cx="6" cy="16" r="2.5" fill="#00B8D9"/>

    <!-- Connecting lines -->
    <line x1="28" y1="4" x2="50" y2="16" stroke="#00B8D9" stroke-width="0.8" opacity="0.6"/>
    <line x1="50" y1="16" x2="50" y2="44" stroke="#00B8D9" stroke-width="0.8" opacity="0.6"/>
    <line x1="50" y1="44" x2="28" y2="56" stroke="#00B8D9" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="56" x2="6" y2="44" stroke="#00B8D9" stroke-width="0.8" opacity="0.6"/>
    <line x1="6" y1="44" x2="6" y2="16" stroke="#00B8D9" stroke-width="0.8" opacity="0.6"/>
    <line x1="6" y1="16" x2="28" y2="4" stroke="#00B8D9" stroke-width="0.8" opacity="0.6"/>

    <!-- Orbit ring -->
    <ellipse cx="28" cy="30" rx="22" ry="12"
      fill="none"
      stroke="white"
      stroke-width="0.8"
      stroke-opacity="0.35"
      stroke-dasharray="3 3"/>
  </g>

  <!-- Text group -->
  <g transform="translate(82, 0)">
    <!-- ScottsTechX -->
    <text y="52"
      font-family="Poppins, Arial, sans-serif"
      font-size="36"
      font-weight="800"
      fill="#0A192F"
      letter-spacing="-0.5">ScottsTechX</text>

    <!-- Enterprise (U) Ltd -->
    <text y="82"
      font-family="Inter, Arial, sans-serif"
      font-size="13"
      font-weight="500"
      fill="#0056D2"
      letter-spacing="3.5">ENTERPRISE (U) LTD</text>

    <!-- Tagline -->
    <text y="100"
      font-family="Inter, Arial, sans-serif"
      font-size="10.5"
      font-weight="400"
      fill="#94A3B8"
      letter-spacing="0.5">Innovative Technology Solutions · Uganda</text>
  </g>
</svg>
